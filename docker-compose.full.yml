services:
  mysql:
    image: mysql:8.0
    container_name: catms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:-root}}
      MYSQL_DATABASE: CatMS
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catms-db-init
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:-root}}
      - DB_NAME=CatMS
      - DB_USE_SSL=false
    command: ["python", "sql/init_if_empty.py"]
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catms-backend
    restart: unless-stopped
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${MYSQL_ROOT_PASSWORD:-${DB_PASSWORD:-root}}
      - DB_NAME=CatMS
      - DB_USE_SSL=false
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - SECRET_KEY=${SECRET_KEY:-careflow-secret-key-for-dev-jwt-tokens-2026}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ../CATMS-frontend
      dockerfile: Dockerfile
    container_name: catms-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
